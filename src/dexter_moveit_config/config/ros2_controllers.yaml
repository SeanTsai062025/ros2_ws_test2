# This config file is used by ros2_control
# NOTE: The authoritative controller config is in dexter_bringup.
#       This file must stay in sync with it so move_group doesn't
#       load a conflicting controller definition.
controller_manager:
  ros__parameters:
    update_rate: 60  # Hz — matches the production USB-CAN control-loop budget

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - base
      - part1
      - part2
      - part3
      - part4
      - part5
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.03
      base:  {trajectory: 0.10, goal: 0.02}
      part1: {trajectory: 0.10, goal: 0.02}
      part2: {trajectory: 0.10, goal: 0.02}
      part3: {trajectory: 0.10, goal: 0.02}
      part4: {trajectory: 0.10, goal: 0.02}
      part5: {trajectory: 0.08, goal: 0.015}

    # Publish controller state at the control-loop rate.
    state_publish_rate: 60.0

    # Action monitor rate — how often JTC checks the physical goal state.
    action_monitor_rate: 20.0
