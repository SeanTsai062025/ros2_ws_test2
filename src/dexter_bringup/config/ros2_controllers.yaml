# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # Six serialized encoder transactions take about 9.8-12.4 ms on the
    # production USB-CAN path. A 60 Hz period is 16.67 ms, which contains the
    # measured batch and the configured 16 ms fault timeout without continuously
    # overrunning the controller-manager deadline.
    update_rate: 60

    # Keep execution diagnostics inside the 16.67 ms control period while
    # allowing for normal USB-CAN scheduling variation.
    diagnostics:
      threshold:
        hardware_components:
          execution_time:
            mean_error:
              warn: 12000.0
              error: 16000.0
            standard_deviation:
              warn: 1500.0
              error: 3000.0

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - base
      - part1
      - part2
      - part3
      - part4
      - part5

    # JTC forwards both sampled values directly. The hardware plugin uses desired
    # position as the F5 target and desired velocity to choose the F5 speed field.
    # This command-interface combination does not enable JTC's PID adapter.
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false

    # Publish controller state at the real-hardware control-loop rate.
    state_publish_rate: 60.0

    # Action monitor rate — how often the JTC checks if the goal is reached
    action_monitor_rate: 20.0

    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.03
      base:  {trajectory: 0.10, goal: 0.02}
      part1: {trajectory: 0.10, goal: 0.02}
      part2: {trajectory: 0.10, goal: 0.02}
      part3: {trajectory: 0.10, goal: 0.02}
      part4: {trajectory: 0.10, goal: 0.02}
      part5: {trajectory: 0.08, goal: 0.03}
